<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BBK Home Daycare | Best Daycare Lake Ridge VA 7AM-6PM</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Segoe UI',Arial;
  background:#FFF8E1;
  color:#333;
  line-height:1.6
}
.hero{
  background:linear-gradient(135deg,#FF8A80,#FFD54F,#81C784,#64B5F6);
  padding:45px 20px;
  text-align:center;
  color:white
}
.logo{
  width:190px;height:190px;
  background:white;
  border-radius:50%;
  margin:0 auto 18px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:8px solid white;
  box-shadow:0 15px 40px rgba(0,0,0,.3)
}
.logo img{width:88%;border-radius:50%}
h1{font-size:60px;text-shadow:0 4px 15px rgba(0,0,0,.3)}
h1 span{color:#FFF176;display:block;font-size:36px}
.tag{
  background:rgba(0,0,0,.3);
  padding:14px 28px;
  border-radius:50px;
  display:inline-block;
  margin:18px 0;
  font-size:19px
}
.hours{
  background:#4D96FF;
  color:white;
  padding:12px 26px;
  border-radius:50px;
  display:inline-block;
  font-weight:bold;
  font-size:18px
}
.badges span{
  background:white;
  color:#333;
  padding:11px 22px;
  border-radius:30px;
  margin:6px;
  display:inline-block;
  font-weight:bold
}
.container{max-width:900px;margin:0 auto;padding:0 20px 40px}
.box{
  background:white;
  border-radius:30px;
  padding:32px;
  margin:28px 0;
  box-shadow:0 10px 35px rgba(0,0,0,.12)
}
.box h2{color:#FF6B6B;text-align:center;font-size:32px;margin-bottom:16px}
.contact{
  background:linear-gradient(135deg,#4D96FF,#6BCB77);
  color:white;
  border-radius:28px;
  padding:32px;
  text-align:center
}
.contact a{color:white;text-decoration:none;font-size:22px;display:block;margin:12px 0;font-weight:bold}
.btn{
  background:white;
  color:#4D96FF;
  padding:14px 30px;
  border-radius:50px;
  display:inline-block;
  margin:8px;
  text-decoration:none;
  font-weight:bold
}
.card{padding:18px;border-radius:18px;margin:12px 0;background:#FFF8E1;border-left:6px solid #FFD93D}
.card.blue{background:#E3F2FD;border-color:#4D96FF}
.card.green{background:#E8F5E9;border-color:#6BCB77}
.card.pink{background:#FCE4EC;border-color:#FF6B6B}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fun{padding:20px;border-radius:20px;text-align:center;box-shadow:0 6px 16px rgba(0,0,0,.1)}
.ad{ background:linear-gradient(135deg,#FFF176,#FF8A80); padding:24px; border-radius:22px; text-align:center; margin:20px 0; border:3px dashed #FF6B6B }
table{width:100%;border-collapse:collapse;margin:15px 0}
th{background:#FF6B6B;color:white;padding:13px}
td{padding:12px;border-bottom:1px solid #eee;text-align:center}
input,textarea,select{width:100%;padding:16px;margin:9px 0;border-radius:14px;border:2px solid #eee}
button{background:linear-gradient(90deg,#FFD93D,#FF6B6B);color:white;padding:18px;border:none;border-radius:30px;font-size:19px;font-weight:bold;width:100%;cursor:pointer}
footer{background:#222;color:white;text-align:center;padding:35px}
@media(max-width:650px){.grid2{grid-template-columns:1fr} h1{font-size:46px}}
</style>
</head>
<body>
<div class="hero">
  <div class="logo"><img src="logo.png" alt="BBK Logo"></div>
  <h1>BBK <span>HOME DAYCARE</span></h1
