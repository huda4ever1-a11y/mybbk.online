<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bright Beginnings Kids (BBK) — Home Daycare</title>
  <meta name="description" content="Bright Beginnings Kids (BBK) — Luxury, safe & loving small home daycare for ages 3–6. Located in Lakeridge, VA." />
  <link rel="icon" href="https://raw.githubusercontent.com/huda4ever1-a11y/mybbk.online/17847f4a314a15bc0f30a29920be60faf93cf76a/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root{
      --sun-yellow:#FFC72C; --coral-red:#FF5252; --sky-blue:#29B6F6; --mint-green:#26A69A;
      --candy-pink:#EC407A; --purple-accent:#AB47BC; --bg-yellow:#FFFDE7;
      --text-dark:#233044; --text-light:#607D8B; --card-white:#ffffff;
      --radius-lg:22px; --max-width:1150px;
      --glass: rgba(255,255,255,0.12);
      --motion-fast: 700ms;
      --motion-medium: 1400ms;
      --motion-slow: 4200ms;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:"Quicksand","Fredoka",system-ui,-apple-system,"Segoe UI",Roboto,Arial;
      color:var(--text-dark);
      background:linear-gradient(180deg,var(--bg-yellow),#FFF8E1);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      line-height:1.5;
    }

    .container{max-width:var(--max-width);margin:0 auto;padding:20px;position:relative;z-index:5}

    /* Top nav */
    .top-nav{background:#E1F5FE;padding:10px 0;border-bottom:3px dashed var(--sky-blue);position:relative;z-index:20}
    .brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text-dark);font-weight:700}
    .logo-thumb{width:64px;height:64px;border-radius:50%;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;background:#fff;border:4px solid #fff;box-shadow:0 6px 18px rgba(0,0,0,.12)}
    nav a{color:var(--text-dark);text-decoration:none;font-weight:700;margin-right:14px}
    .contact-btn{background:var(--coral-red);color:#fff;padding:8px 14px;border-radius:20px;text-decoration:none;box-shadow:0 6px 18px rgba(255,82,82,.18)}

    /* Header */
    header{
      padding:36px 18px;text-align:center;color:#fff;
      background:linear-gradient(135deg,var(--sun-yellow),var(--coral-red),var(--purple-accent),var(--sky-blue));
      background-size:400% 400%;animation:gradientBG 12s ease infinite;
      border-bottom-left-radius:50px;border-bottom-right-radius:50px;
      box-shadow:0 10px 30px rgba(0,0,0,.12);margin-bottom:18px;position:relative;overflow:hidden;
    }
    @keyframes gradientBG{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

    .logo-badge{width:220px;height:220px;margin:0 auto 12px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;padding:10px;border:6px solid #fff;box-shadow:0 12px 30px rgba(0,0,0,.18);overflow:hidden;position:relative}
    .logo-badge img{width:100%;height:100%;object-fit:contain;display:block}
    .tagline{display:inline-block;background:rgba(255,255,255,.28);padding:10px 22px;border-radius:30px;font-family:'Fredoka',cursive;font-weight:700;backdrop-filter:blur(6px);margin-top:8px}

    /* Sparkles */
    .header-sparkles{position:absolute;inset:0;pointer-events:none;z-index:2}
    .sparkle { fill: #FFF9C4; opacity:0.95; transform-origin:center; animation:twinkle var(--motion-medium) infinite ease-in-out; }
    .sparkle.slow { animation-duration: var(--motion-slow); }
    @keyframes twinkle {0%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.12)}100%{opacity:.25;transform:scale(.8)}}

    /* Cards & sections */
    .card{background:var(--card-white);border-radius:var(--radius-lg);padding:22px;box-shadow:0 10px 24px rgba(0,0,0,.06)}
    .story-card{border:4px dashed var(--sun-yellow)}
    .badge-grid{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px}
    .badge{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:var(--sky-blue);color:#fff;font-family:'Fredoka',cursive;font-weight:700;box-shadow:0 6px 14px rgba(0,0,0,.06)}

    /* Gallery */
    .gallery-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin:30px 0}
    .gallery-card{border-radius:18px;overflow:hidden;text-align:center;transition:transform .28s,box-shadow .28s;position:relative}
    .gallery-card:hover{transform:translateY(-8px) scale(1.02);box-shadow:0 18px 40px rgba(0,0,0,.12)}
    .svg-illustration{height:170px;display:flex;align-items:center;justify-content:center;padding:12px}

    /* Cartoon Moments — rich motion */
    .play-area{position:relative;margin-top:20px}
    .kid-row{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;align-items:flex-end}
    .kid-card{width:170px;height:220px;background:linear-gradient(180deg,#fff,#fff);border-radius:18px;display:flex;align-items:center;justify-content:center;padding:12px;position:relative;overflow:visible}
    .kid-svg{width:140px;height:180px;overflow:visible;display:block}

    .move-wavy { animation: wavy var(--motion-slow) ease-in-out infinite; transform-origin:center; }
    @keyframes wavy {0%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-10px) rotate(2deg)}100%{transform:translateY(0) rotate(-1deg)}}
    .move-bounce { animation: bounce var(--motion-medium) cubic-bezier(.25,.72,.35,1.2) infinite; transform-origin:50% 100%; }
    @keyframes bounce {0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
    .move-rotate { animation: gentle-rotate var(--motion-slow) linear infinite; transform-origin:center; }
    @keyframes gentle-rotate {0%{transform:rotate(0deg)}50%{transform:rotate(6deg)}100%{transform:rotate(0deg)}}
    .move-sparkle { animation: sparkle-pop 1.4s ease-in-out infinite; }
    @keyframes sparkle-pop {0%{transform:scale(.9);opacity:.6}50%{transform:scale(1.12);opacity:1}100%{transform:scale(.9);opacity:.6}}

    /* balloons & confetti */
    .decor-balloon { position:absolute; pointer-events:none; }
    .balloon-1 { left:6%; top:8%; width:120px; height:180px; animation:rise 9s linear infinite; }
    .balloon-2 { right:6%; top:12%; width:100px; height:150px; animation:rise 7.5s linear infinite reverse; }
    @keyframes rise {0%{transform:translateY(40px) scale(.98)}50%{transform:translateY(-12px) scale(1.02)}100%{transform:translateY(40px) scale(.98)}}

    .confetti { position:absolute; left:0; top:0; right:0; bottom:0; pointer-events:none; z-index:1; }
    .c-dot { width:8px;height:14px;display:block;position:absolute;border-radius:2px;opacity:.95; animation:confetti-fall linear infinite; }
    @keyframes confetti-fall {0%{transform:translateY(-10vh) rotate(0deg)}100%{transform:translateY(120vh) rotate(360deg)}}

    /* Schedule & contact */
    .schedule-box{border:4px solid var(--mint-green);padding:24px;border-radius:18px}
    .time-pill{display:inline-block;padding:8px 12px;border-radius:999px;background:rgba(0,0,0,0.06);font-weight:700;margin-bottom:6px}
    .contact-card{color:#fff;background:linear-gradient(120deg,var(--sky-blue),var(--purple-accent),var(--candy-pink));padding:24px;border-radius:18px}
    .input{width:100%;padding:10px;border-radius:8px;border:none;margin-top:6px}
    .btn-submit{background:#fff;color:#233044;padding:10px 14px;border-radius:8px;border:none;font-weight:800;cursor:pointer}

    footer{text-align:center;padding:26px;color:var(--text-light);font-weight:700}

    @media (prefers-reduced-motion: reduce){
      * { animation: none !important; transition: none !important; }
      header{animation:none}
    }
    @media (max-width:900px){ .kid-card{width:140px;height:190px} .logo-badge{width:160px;height:160px} .svg-illustration{height:120px} }
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
  </style>
</head>
<body>

  <main class="container" id="maincontent" tabindex="-1" role="main">

    <!-- Top nav -->
    <div class="top-nav" role="navigation" aria-label="Top navigation">

          <img src="https://raw.githubusercontent.com/huda4ever1-a11y/mybbk.online/17847f4a314a15bc0f30a29920be60faf93cf76a/logo.png" alt="Bright Beginnings Kids (BBK) logo" style="max-width:100%;max-height:100%;" loading="lazy" onerror="this.style.display='none'">
        </picture>

        <!-- SVG fallback -->
        <svg width="140" height="140" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="position:absolute">

          <text x="50%" y="55%" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="700" font-size="22" fill="#fff">BBK</text>

      <div class="tagline" aria-hidden="false">Luxury • Safe • Loving Home Daycare — Class of 4 (ages 3–6)</div>

      <!-- Sparkles -->
      <svg class="header-sparkles" aria-hidden="true" viewBox="0 0 700 160" preserveAspectRatio="none">
        <g transform="translate(40,30)"><polygon class="sparkle" points="6,0 8,4 12,5 9,8 10,12 6,10 2,12 3,8 0,5 4,4" /></g>
        <g transform="translate(240,18)"><polygon class="sparkle slow" points="6,0 8,4 12,5 9,8 10,12 6,10 2,12 3,8 0,5 4,4" /></g>
        <g transform="translate(480,30)"><polygon class="sparkle" points="6,0 8,4 12,5 9,8 10,12 6,10 2,12 3,8 0,5 4,4" /></g>

      <div style="margin-top:14px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;position:relative;z-index:6">
        <a href="mailto:huda4ever1@gmail.com" style="background:rgba(255,255,255,.95);padding:8px 12px;border-radius:18px;text-decoration:none;color:var(--text-dark);font-weight:700;display:inline-flex;align-items:center;gap:8px" aria-label="Email BBK">
          <i class="fa-solid fa-envelope" style="color:var(--candy-pink)"></i> huda4ever1@gmail.com
        </a>

        <a href="tel:+12028135994" style="background:rgba(255,255,255,.95);padding:8px 12px;border-radius:18px;text-decoration:none;color:var(--text-dark);font-weight:700;display:inline-flex;align-items:center;gap:8px" aria-label="Call BBK">
          <i class="fa-solid fa-phone" style="color:var(--mint-green)"></i> (202) 813‑5994 — Lakeridge, VA

    <!-- rest of page remains same (About, Cartoon Moments, Gallery, Schedule, Contact, Footer) -->

  </main>

  <script>
    // small confetti & contact handler (same behavior as before)
    function handleFormSubmit(e){ e.preventDefault(); const name=document.getElementById('name')?.value?.trim(); const email=document.getElementById('email')?.value?.trim(); if(!name||!email){ const s=document.getElementById('formMsg'); if(s){s.textContent='Please provide your name and email.';s.style.color='#FFEB3B';} return false;} const subject=encodeURIComponent('BBK inquiry from '+name); let body='Name: '+name+'\\nEmail: '+email+'\\n\\nMessage:\\n'+(document.getElementById('message')?.value||'(no message)'); window.location.href='mailto:huda4ever1@gmail.com?subject='+subject+'&body='+encodeURIComponent(body); const s=document.getElementById('formMsg'); if(s){s.textContent='Opening mail client...';s.style.color='#fff';} return false; }
    (function createConfetti(){ if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return; const confettiParent=document.querySelector('.confetti'); if(!confettiParent) return; const colors=['#FF8A80','#FFD54F','#90CAF9','#A5D6A7','#FFCDD2','#F8BBD0','#B39DDB']; const count=26; for(let i=0;i<count;i++){ const el=document.createElement('span'); el.className='c-dot'; const size=Math.random()*10+6; el.style.width=size+'px'; el.style.height=(size*1.2)+'px'; el.style.left=Math.random()*100+'%'; el.style.top=(Math.random()*10-10)+'vh'; el.style.background=colors[Math.floor(Math.random()*colors.length)]; el.style.transform='rotate('+(Math.random()*360)+'deg)'; el.style.animationDuration=(4+Math.random()*6)+'s'; el.style.animationDelay=(Math.random()*2)+'s'; el.style.opacity=0.95; confettiParent.appendChild(el);} setTimeout(()=>{ confettiParent.innerHTML=''; },18000); })();
  </script>
</body>
