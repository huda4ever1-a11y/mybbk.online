<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BBK Home Daycare | Lake Ridge VA - 7AM-6PM - Mom of 3</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial;background:#FFF8E1;min-height:100vh;color:#333}
.hero{background:linear-gradient(135deg,#FF8A80 0%,#FFD54F 35%,#81C784 70%,#64B5F6 100%);padding:35px 20px;text-align:center;color:white}
.logo{width:180px;height:180px;background:white;border-radius:50%;margin:0 auto 15px;display:flex;align-items:center;justify-content:center;border:8px solid white;box-shadow:0 15px 40px rgba(0,0,0,.3)}
.logo img{width:88%;border-radius:50%}
h1{font-size:60px;line-height:.9;text-shadow:0 4px 15px rgba(0,0,0,.3)} .y{color:#FFF176}
.tag{background:rgba(0,0,0,.3);padding:14px 26px;border-radius:50px;display:inline-block;margin:15px 0;font-size:19px}
.hours-banner{background:#4D96FF;color:white;padding:14px 24px;border-radius:50px;display:inline-block;font-weight:bold;margin:10px;font-size:18px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.badges span{background:white;color:#333;padding:10px 20px;border-radius:25px;margin:6px;display:inline-block;font-weight:bold}
.container{max-width:900px;margin:0 auto;padding:0 20px 40px}
.whitebox{background:white;border-radius:32px;padding:32px;margin:26px 0;box-shadow:0 12px 40px rgba(0,0,0,.15)}
.whitebox h2{color:#FF6B6B;text-align:center;margin-bottom:16px;font-size:30px}
.contact-big{background:linear-gradient(135deg,#4D96FF,#6BCB77);color:white;border-radius:28px;padding:28px;text-align:center;margin:26px 0;box-shadow:0 12px 30px rgba(0,0,0,.2)}
.contact-big a{color:white;text-decoration:none;font-weight:bold;font-size:20px;display:block;margin:10px 0}
.contact-big .btn{background:white;color:#4D96FF;padding:14px 28px;border-radius:50px;display:inline-block;margin:8px;text-decoration:none;font-weight:bold;box-shadow:0 4px 15px rgba(0,0,0,.2)}
.kids-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}
.kid-box{padding:20px;border-radius:22px;text-align:center;font-size:15px;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.kid-box b{font-size:17px;display:block;margin-bottom:6px}
.yellow{background:linear-gradient(135deg,#FFF9C4,#FFD54F)} .pink{background:linear-gradient(135deg,#F8BBD0,#F48FB1);color:white} .blue{background:linear-gradient(135deg,#BBDEFB,#64B5F6);color:white} .green{background:linear-gradient(135deg,#C8E6C9,#81C784);color:white}
.love-box{background:#FFF3E0;border:3px dashed #FF6B6B;padding:20px;border-radius:22px;margin:18px 0;text-align:center}
table{width:100%;border-collapse:collapse;margin:15px 0} th{background:#FF6B6B;color:white;padding:12px} td{padding:12px;border-bottom:1px solid #eee;text-align:center}
input,textarea,select{width:100%;padding:16px;margin:9px 0;border-radius:14px;border:2px solid #eee;font-size:16px}
button{background:linear-gradient(90deg,#FFD93D,#FF6B6B);color:white;padding:18px;border:none;border-radius:30px;font-size:19px;font-weight:bold;width:100%;cursor:pointer}
footer{background:#333;color:white;text-align:center;padding:30px}
@media(max-width:600px){.kids-grid{grid-template-columns:1fr} h1{font-size:46px}}
</style>
</head>
<body>
<div class="hero">
<div class="logo"><img src="logo.png" alt="BBK"></div>
<h1>BBK<br><span class="y">HOME DAYCARE</span></h1>
<div class="tag">🌈 Where Little Hearts Feel Big Love! Safe, Magical & Full of Giggles! ✨👑</div><br>
<div class="hours-banner">⏰ Open 7:00 AM - 6:00 PM | Mon - Fri | Only 4 Kids!</div><br>
<div class="badges">
<span>🎓 Bachelor's Degree</span>
<span>👩‍👧‍👦 Mom of 3 Amazing Kids</span>
<span>👩‍🏫 10+ Years</span>
<span>💎 Only 4 Kids</span>
<span>👶 Ages 3-6</span>
<span>🗣️ Arabic & English</span>
</div>
